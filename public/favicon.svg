<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Federated learning network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23568f"/>
      <stop offset="1" stop-color="#122e57"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0f6"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- spokes: parameter server -> clients -->
  <g stroke="#a9c2e6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="16" y1="16" x2="26" y2="16"/>
    <line x1="16" y1="16" x2="11" y2="7.3"/>
    <line x1="16" y1="16" x2="6" y2="16"/>
    <line x1="16" y1="16" x2="11" y2="24.7"/>
    <line x1="16" y1="16" x2="21" y2="24.7"/>
  </g>
  <!-- one unreliable / offline client: faded dashed uplink -->
  <line x1="16" y1="16" x2="21" y2="7.3" stroke="#7fa6d6" stroke-width="1.5"
        stroke-linecap="round" stroke-opacity="0.32" stroke-dasharray="2 2.4"/>

  <!-- client nodes -->
  <g fill="#e9f0fc">
    <circle cx="26" cy="16" r="2.5"/>
    <circle cx="11" cy="7.3" r="2.5"/>
    <circle cx="6" cy="16" r="2.5"/>
    <circle cx="11" cy="24.7" r="2.5"/>
    <circle cx="21" cy="24.7" r="2.5"/>
  </g>
  <!-- the unreliable client, dimmed -->
  <circle cx="21" cy="7.3" r="2.3" fill="#6b86ae"/>

  <!-- parameter server (hub) -->
  <circle cx="16" cy="16" r="5" fill="#16356190"/>
  <circle cx="16" cy="16" r="4.1" fill="url(#hub)"/>
  <circle cx="16" cy="16" r="4.1" fill="none" stroke="#4cc9f0" stroke-width="1"/>
  <circle cx="16" cy="16" r="1.5" fill="#23568f"/>
</svg>
